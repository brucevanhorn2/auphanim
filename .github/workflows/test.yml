name: Test

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o auphanim .

      - name: Verify goreleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
